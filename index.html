<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f2937">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MoneyManager</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="app.css?v=6">
</head>
<body class="bg-gray-900 text-gray-100">
  <div id="header"></div>
  <main id="main" class="px-4 pt-4 pb-40 max-w-3xl mx-auto"></main>
  <div id="nav"></div>
  <div id="modal-root"></div>
  <div id="snack-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Service Worker: aggiorna da solo; ricarica la pagina quando prende il controllo (se non stai compilando un form)
    if ('serviceWorker' in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      let reloaded = false;
      navigator.serviceWorker.register('./sw.js').catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || reloaded) return;
        reloaded = true;
        if (!document.getElementById('modal-root').innerHTML.trim()) location.reload();
      });
    }
  </script>
  <script src="app.js?v=6"></script>
</body>
</html>
